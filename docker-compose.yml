services:

  mongodb:
    image: mongo:latest
    container_name: infra-mongodb
    env_file:
      - .env
    ports:
      - "27017:27017"  # Exposed to host for external connections
    volumes:
      - infra-mongodb-data:/data/db
    networks:
      - infra-net
    restart: unless-stopped


  mongo-express:
    image: mongo-express:latest
    container_name: infra-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: "infra-mongodb"
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
      ME_CONFIG_BASICAUTH_USERNAME: "admin"
      ME_CONFIG_BASICAUTH_PASSWORD: "trove-admin"
    ports:
      - "8081:8081"  # Browser UI for inspecting/visualizing MongoDB data
    networks:
      - infra-net
    depends_on:
      - mongodb
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:3-management
    container_name: infra-rabbitmq
    env_file:
      - .env
    expose:
      - 5672
      - 15672
    ports:
      - "15672:15672"  # Management UI
    volumes:
      - infra-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - infra-net
    restart: unless-stopped


volumes:
  infra-mongodb-data:
    # Data copied over from the original cve-trove-owned volume
    # (cve_trove_mongodb_data) during the infra-hub migration -- pre-created
    # and populated via a throwaway container, hence external here.
    name: infra-mongodb-data
    external: true
  infra-rabbitmq-data:
    # Same as above, copied from cve_trove_rabbitmq_data.
    name: infra-rabbitmq-data
    external: true


networks:
  infra-net:
    # Owned/created here -- the shared network backing all infra-hub
    # services. Other repos (e.g. cve-trove) attach to it as external.
    name: infra-net
